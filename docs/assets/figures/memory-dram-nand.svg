<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="DRAM 셀과 3D NAND 구조 비교" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>DRAM 셀과 3D NAND 구조 비교</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="329" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30.0" font-size="19" fill="#1f2937" text-anchor="start" font-weight="700" dominant-baseline="middle">DRAM과 NAND는 이렇게 다르게 생겼어요</text>
<text x="24" y="56.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">개념을 단순화한 그림입니다</text>
<rect x="24" y="74" width="404" height="236" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
<text x="226" y="96.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">DRAM 셀 (1T1C)</text>
<line x1="70" y1="140" x2="70" y2="250" stroke="#2563eb" stroke-width="3"/>
<text x="82" y="240.0" font-size="12" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">비트라인</text>
<line x1="70" y1="200" x2="140" y2="200" stroke="#1f2937" stroke-width="2"/>
<rect x="140" y="180" width="60" height="40" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="170" y="200.0" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">T</text>
<line x1="170" y1="180" x2="170" y2="140" stroke="#7c3aed" stroke-width="3"/>
<line x1="100" y1="140" x2="380" y2="140" stroke="#7c3aed" stroke-width="3"/>
<text x="320" y="126.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">워드라인(스위치 켜기)</text>
<line x1="200" y1="200" x2="260" y2="200" stroke="#1f2937" stroke-width="2"/>
<line x1="260" y1="180" x2="260" y2="220" stroke="#1f2937" stroke-width="3"/>
<line x1="274" y1="180" x2="274" y2="220" stroke="#1f2937" stroke-width="3"/>
<line x1="274" y1="200" x2="320" y2="200" stroke="#1f2937" stroke-width="2"/>
<text x="267" y="238.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">커패시터</text>
<text x="334" y="200.0" font-size="18" fill="#1f2937" text-anchor="middle" font-weight="400" dominant-baseline="middle">⏚</text>
<text x="250" y="262.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600" dominant-baseline="middle">전하가 있으면 1, 없으면 0</text>
<text x="226" y="288.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">전하가 새므로 주기적으로 다시 써야 함(Refresh)</text>
<rect x="452" y="74" width="404" height="236" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
<text x="654" y="96.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">3D NAND (V-NAND)</text>
<rect x="500" y="128" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="137.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 6</text>
<rect x="500" y="154" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="163.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 5</text>
<rect x="500" y="180" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="189.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 4</text>
<rect x="500" y="206" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="215.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 3</text>
<rect x="500" y="232" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="241.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 2</text>
<rect x="500" y="258" width="240" height="18" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="770" y="267.0" font-size="11" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">셀 층 1</text>
<rect x="608" y="116" width="24" height="172" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="600" y="112.0" font-size="12" fill="#d97706" text-anchor="end" font-weight="600" dominant-baseline="middle">수직 채널 →</text>
<text x="654" y="298.0" font-size="1" fill="#1f2937" text-anchor="middle" font-weight="400" dominant-baseline="middle"></text>
<text x="560" y="300.0" font-size="1" fill="#1f2937" text-anchor="middle" font-weight="400" dominant-baseline="middle"></text>
<text x="654" y="298.0" font-size="12" fill="#059669" text-anchor="middle" font-weight="600" dominant-baseline="middle">층을 위로 쌓아 용량을 늘림</text>
</svg>
