<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="직무별 4단계 학습 로드맵" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>직무별 4단계 학습 로드맵</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="219" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30.0" font-size="19" fill="#1f2937" text-anchor="start" font-weight="700" dominant-baseline="middle">모든 직무 장의 4단계 학습 로드맵</text>
<text x="24" y="56.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">기간은 학기 중 병행 기준의 대략적인 가이드</text>
<rect x="24" y="80" width="190" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="119.0" y="106.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">1단계 입문</text>
<text x="119.0" y="134.0" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="600" dominant-baseline="middle">1~2개월</text>
<text x="119.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">큰 그림 잡기</text>
<line x1="215" y1="135" x2="231" y2="135" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="232" y="80" width="190" height="110" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="327.0" y="106.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">2단계 기본기</text>
<text x="327.0" y="134.0" font-size="13" fill="#059669" text-anchor="middle" font-weight="600" dominant-baseline="middle">3~4개월</text>
<text x="327.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">교과서 수준 직접 해보기</text>
<line x1="423" y1="135" x2="439" y2="135" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="440" y="80" width="190" height="110" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="535.0" y="106.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">3단계 심화</text>
<text x="535.0" y="134.0" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="600" dominant-baseline="middle">3~6개월</text>
<text x="535.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">한 갈래 끝까지</text>
<line x1="631" y1="135" x2="647" y2="135" stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
<rect x="648" y="80" width="190" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="743.0" y="106.0" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">4단계 포트폴리오</text>
<text x="743.0" y="134.0" font-size="13" fill="#d97706" text-anchor="middle" font-weight="600" dominant-baseline="middle">2~3개월</text>
<text x="743.0" y="162.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">보여줄 수 있게 정리</text>
</svg>
