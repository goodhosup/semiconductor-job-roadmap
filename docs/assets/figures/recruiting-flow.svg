<text x="438.0" y="178.6" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">수리·추리</text><text x="438.0" y="193.6" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">(S/W는 별도 테스트)</text>
