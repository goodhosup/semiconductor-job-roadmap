<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="트랜지스터 구조: Planar, FinFET, GAA" font-family="'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<title>트랜지스터 구조: Planar, FinFET, GAA</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker></defs>
<rect x="0.5" y="0.5" width="879" height="309" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
<text x="24" y="30.0" font-size="19" fill="#1f2937" text-anchor="start" font-weight="700" dominant-baseline="middle">트랜지스터 구조의 변화</text>
<text x="24" y="56.0" font-size="13" fill="#4b5563" text-anchor="start" font-weight="400" dominant-baseline="middle">게이트가 채널을 감싸는 면이 넓어질수록 전류를 더 잘 제어합니다</text>
<rect x="24" y="74" width="260" height="196" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
<text x="154" y="96.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">Planar</text>
<rect x="64" y="214" width="180" height="16" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="94" y="192" width="120" height="22" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<rect x="104" y="160" width="100" height="30" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="154" y="248.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">게이트가 위 1면</text>
<rect x="308" y="74" width="260" height="196" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
<text x="438" y="96.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">FinFET</text>
<rect x="348" y="214" width="180" height="16" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="376" y="120" width="124" height="94" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="422" y="134" width="32" height="80" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="438" y="248.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">게이트가 3면을 감쌈</text>
<rect x="592" y="74" width="260" height="196" rx="10" fill="#f8fafc" stroke="#9ca3af" stroke-width="1.5"/>
<text x="722" y="96.0" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700" dominant-baseline="middle">GAA</text>
<rect x="632" y="214" width="180" height="16" rx="2" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
<rect x="660" y="116" width="124" height="98" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="682" y="128" width="80" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<rect x="682" y="156" width="80" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<rect x="682" y="184" width="80" height="14" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="722" y="248.0" font-size="13" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">게이트가 4면을 감쌈</text>
<text x="440" y="290.0" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="400" dominant-baseline="middle">보라 = 게이트, 초록 = 채널(전류가 흐르는 길), 회색 = 기판</text>
</svg>
